services:
  - type: web
    name: krishna-attendance-backend
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: AI_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: ADMIN_USERNAME
        value: ANIK
      - key: ADMIN_PASSWORD
        sync: false
